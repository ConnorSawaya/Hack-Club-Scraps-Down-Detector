name: Test static Scraps dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run offline tests
        run: node --test tests/status-probe.test.mjs
      - name: Build the static dashboard
        run: node scripts/build-site.mjs
